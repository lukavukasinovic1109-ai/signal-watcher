name: Signal watcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Posalji test notifikaciju"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: watcher
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - env:
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
        run: python watch.py
      - run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then mkdir -p state; date -u > state/heartbeat; fi
          git add state || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
